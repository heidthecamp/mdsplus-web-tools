<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../resources/gridstack-all.js"></script>
    <link href="../resources/gridstack.min.css" rel="stylesheet"></link>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            --bs-gutter-x: 0.5rem;
            .container {
                --bs-gutter-x: 0.5rem;
                --bs-gutter-y: 0;
                margin: 10px;
            }
        }
        footer {
            background-color: white;
        }

        button:disabled {
            color: #888;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }
        #scope,
        #traverser-panel {
            padding-left: 0 !important;
            padding-right: 0 !important;
            overflow-x: hidden;
        }
        .grid-stack-item-content {
            display: flex;
            flex-direction: column;
            border: 1px solid #CCC;
            overflow: visible !important;
        }
        /* .panel {
        } */
        .panel .plot {
            flex: 1;
            height: 100%;
        }
        .panel .navbar {
            flex: none;
            padding: 0;
        }
        .panel .title {
            overflow-x: hidden;
        }
        .navbar-nav {
            flex-direction: row;
        }
        .handle {
            flex: 1;
            height: 40px; /* HACK: Improve */
            cursor: pointer;
            min-width: 10px;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }
        #overlay.shown {
            display: block;
        }
        #panel-form,
        #global-defaults-form,
        #traverser-open-form {
            width: 80%;
            margin: 100px auto 0 auto;
            padding: 20px;
            padding-right: 40px;
            border: 1px solid black;
            border-radius: 20px;
            background-color: white;
        }
        #panel-form input[type="checkbox"] {
            margin-top: 13px;
        }
        #panel-preview {
            float: right;
        }
        .panel-defaults input[type="checkbox"] {
            margin-top: 25px !important; /* HACK: Align properly */
        }
        .trace-form {
            display: none;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .global-default-form {
            display: none;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .trace-form.shown {
            display: block;
        }
        .column {
            flex-direction: column;
        }
        .nav-link:hover {
            opacity: 0.5;
        }
        .error {
            text-align: center;
            color: red;
            font-size: 20px;
            margin-top: 20px;
        }

        .traverser-title {
            font-size: 30px;
        }
        #traverser-panel.hidden {
            width: 50px;
        }
        #traverser-panel.hidden #traverser-content {
            display: none;
        }
        #traverser-minimized {
            display: none;
            position: absolute;
            top: 15px;
            left: 0px;
            width: 50px;
        }
        #traverser-expand {
            display: block;
            margin-left: 15px;
            margin-bottom: 10px;
        }
        #traverser-panel.hidden #traverser-minimized {
            display: block;
        }
        #traverser-minimized .traverser-title {
            rotate: 90deg;
        }
        #traverser-collapse {
            float: left;
            margin-top: 8px;
            margin-right: 10px;
        }
        #traverser-content {
            width: 100%;
        }
        #traverser-open {
            cursor: pointer;
        }
        .traverser {
            display: none;
        }
        .traverser.active {
            display: block;
        }
        .traverser .expandable > .name {
            cursor: pointer;
        }
        .traverser .expandable > .name::after {
            content: ' +';
        }
        .traverser .expanded > .name::after {
            content: ' -';
        }
        .traverser .children,
        .traverser .members {
            padding-left: 20px;
            display: none;
        }
        .traverser .expanded > .children,
        .traverser .expanded > .members {
            display: block;
        }
        .traverser .children .name::before {
            content: '.';
        }
        .traverser .members .name::before {
            content: ':';
        }
        .traverser .signal {
            cursor: pointer;
        }
        #traverser-tabs {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        #traverser-tabs .nav-link {
            color: white;
            cursor: pointer;
        }
        #traverser-tabs .nav-link.active {
            color: black;
        }
        #traverser-preview {
            position: fixed;
            display: none;
            background-color: white;
            max-width: 400px;
            border: 1px solid black;
        }
        #traverser-preview .description {
            word-wrap: break-word;
            padding: 5px;
        }
        #traverser-preview .description .expression {
            font-family: 'Courier New', Courier, monospace;
            font-size: 80%;
        }
        #traverser-preview.plot-shown .description {
            border-top: 1px solid black;
        }
        #traverser-preview.shown {
            display: block;
        }
        #traverser-preview.plot-shown .plot {
            width: 400px;
            height: 200px;
            padding-right: 20px;
        }
        #traverser-select {
            width: calc(100% - 60px);
        }
        .warn {
            color: #A22 !important;
        }
        .warn:hover {
            color: red !important;
        }
        .dropdown-item:hover {
            font-weight: bold;
        }

        #current-shot {
            font-family: monospace;
            padding-left: 5px;
            padding-right: 5px;
            padding-top: 5px;
            font-size: 20px;
            width: 150px;
            text-align: center;
        }

        #error-message {
            color: red;
        }
    </style>

    <template id="traverser-node-template">
        <span class="name"></span>
        <div class="members"></div>
        <div class="children"></div>
    </template>

    <template id="traverser-open-form-template">
        <div id="traverser-open-form" class="container-fluid">
            <div class="row">
                <div class="col-4">
                    <div class="row mb-3">
                        <label for="traverser-tree" class="col-sm-2 col-form-label">Tree</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="traverser-tree" type="text" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="traverser-shot" class="col-sm-2 col-form-label">Shot</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="traverser-shot" type="text" />
                        </div>
                    </div>
                    <!--
                    <div class="row mb-3">
                        <label for="traverser-mode" class="col-sm-2 col-form-label">Mode</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="traverser-mode" type="text" />
                        </div>
                    </div>
                    -->
                    <div class="row">
                        <div class="container-fluid">
                            <input type="submit" data-action="open" class="btn btn-primary" value="Open" />
                            <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="panel-template">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-nav">
                    <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="../octicons/gear.svg" />
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" data-action="refresh-panel">Refresh</a></li>
                        <li><a class="dropdown-item" data-action="edit">Edit</a></li>
                        <li><a class="dropdown-item" data-action="auto-x-y">Auto X & Y</a></li>
                        <li><a class="dropdown-item" data-action="auto-x">Auto X</a></li>
                        <li><a class="dropdown-item" data-action="auto-y">Auto Y</a></li>
                        <li><a class="dropdown-item" data-action="all-x-auto-y">All X Auto Y</a></li>
                        <li><a class="dropdown-item warn" data-action="remove">Delete</a></li>
                    </ul></div>
                <div class="navbar-brand title handle"></div>
            </div>
        </nav>
        <div class="plot">Loading...</div>
    </template>

    <template id="panel-form-template">
        <div id="panel-form" class="container-fluid">
            <div class="row">
                <div class="col-4">
                    <div class="row mb-3">
                        <div class="col-sm-1">
                            <input id="panel-title_expr-default" type="checkbox">
                        </div>
                        <label for="panel-title_expr" class="col-sm-2 col-form-label">Title</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="panel-title_expr" type="text" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-1">
                            <input id="panel-y_min_expr-default" type="checkbox" />
                        </div>
                        <label for="panel-y_min_expr" class="col-sm-2 col-form-label">Y Min</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="panel-y_min_expr" type="text" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-1">
                            <input id="panel-y_max_expr-default" type="checkbox" />
                        </div>
                        <label for="panel-y_max_expr" class="col-sm-2 col-form-label">Y Max</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="panel-y_max_expr" type="text" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-1">
                            <input id="panel-x_min_expr-default" type="checkbox" />
                        </div>
                        <label for="panel-x_min_expr" class="col-sm-2 col-form-label">X Min</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="panel-x_min_expr" type="text" />
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-1">
                            <input id="panel-x_max_expr-default" type="checkbox" />
                        </div>
                        <label for="panel-x_max_expr" class="col-sm-2 col-form-label">X Max</label>
                        <div class="col-sm-9">
                            <input class="form-control" id="panel-x_max_expr" type="text" />
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <ul class="nav nav-tabs" id="trace-form-tabs">
                            <li class="nav-item">
                                <a class="nav-link" data-action="add-trace" ><img src="../octicons/diff-added.svg"  /></a>
                            </li>
                            <li class="nav-item">

                            </li>
                        </ul>
                    </div>
                    
                    <div class="row mb-3">
                        <div id="trace-forms" class="col-sm-12"></div>
                    </div>
                    <div class="row">
                        <div class="container-fluid">
                            <button type="button" data-action="save" class="btn btn-primary">Save</button>
                            <button type="button" data-action="apply" class="btn btn btn-secondary">Apply</button>
                            <button type="button" data-action="reset" class="btn btn btn-secondary">Reset</button>
                            <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                        </div>
                    </div>
                </div>
                <div id="panel-preview" class="col-8">
                    Loading...
                </div>
            </div>
        </div>
    </template>

    <template id="trace-form-template">
        <li class="trace-form">
            <div class="row mb-3">
                <div class="container-fluid">
                    <button type="button", class="btn btn-secondary" data-action="reveal-trace-in-traverser">Reveal in Traverser</button>
                    <button type="button", data-action="remove-trace-form" class="btn btn-danger" id="remove-button">Remove</button>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input id="trace-y_expr-default" type="checkbox" /> <br />
                </div>
                <label for="trace-y_expr" class="col-sm-2 col-form-label">Y Axis</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-y_expr" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input id="trace-x_expr-default" type="checkbox" /> <br />
                </div>
                <label for="trace-x_expr" class="col-sm-2 col-form-label">X Axis</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-x_expr" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input id="trace-tree-default" type="checkbox" /> <br />
                </div>
                <label for="trace-tree" class="col-sm-2 col-form-label">Tree</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-tree" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input id="trace-shot_expr-default" type="checkbox" /> <br />
                </div>
                <label for="trace-shot_expr" class="col-sm-2 col-form-label">Shot</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-shot_expr" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input id="trace-default_node_expr-default" type="checkbox" /> <br />
                </div>
                <label for="trace-default_node_expr" class="col-sm-2 col-form-label">Default Node</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-default_node_expr" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1"></div>
                <label for="trace-color" class="col-sm-2 col-form-label">Trace Color</label>
                <div class="col-sm-9">
                    <input class="form-control" id="trace-color" type="text" />
                </div>
            </div>
        </li>
    </template>

    <template id="global-defaults-form-template">
        <div id="global-defaults-form" class="container-fluid">
            <legend for="settings-form-form">Settings</legend>
            <fieldset id="settings-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="scope-title_expr" class="col-sm-3 col-form-label">Title:</label>
                    <div class="col-sm-9">
                        <input id="scope-title_expr" class="form-control" type="text" />
                    </div>
                </div>
            </fieldset>
            <legend for="panel-default-form">Global Panel Defaults</legend>
            <fieldset id="panel-default-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="global-defaults-title_expr" class="col-sm-3 col-form-label">Title:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-title_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-y-min"  class="col-sm-3 col-form-label">Y Min:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-y-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-y-max"  class="col-sm-3 col-form-label">Y Max:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-y-max" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x-min"  class="col-sm-3 col-form-label">X Min:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x-max"  class="col-sm-3 col-form-label">X Max:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x-max" class="form-control" type="text" />
                    </div>
                </div>
            </fieldset>
            <legend for="trace-default-form">Global Trace Defaults</legend>
            <fieldset id="trace-default-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="global-defaults-y_expr"  class="col-sm-3 col-form-label">Y Axis:</label>

                    <div class="col-sm-9">
                        <input id="global-defaults-y_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x_expr"  class="col-sm-3 col-form-label">X Axis:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-tree"  class="col-sm-3 col-form-label">Tree:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-tree" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-shot_expr"  class="col-sm-3 col-form-label">Shot:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-shot_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-default_node_expr"  class="col-sm-3 col-form-label">Default Node:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-default_node_expr"  class="form-control" type="text" />
                    </div>
            </fieldset>
            <div class="row">
                <div class="container-fluid">
                    <button type="button" data-action="save" class="btn btn-primary">Save</button>
                    <button type="button" data-action="reset" class="btn btn-primary">Reset</button>
                    <button type="button" data-action="cancel" class="btn btn-primary">Cancel</button>
                </div>
            </div>
        </div>
    </template>

</head>
<body>
    <script type="module" src="index.js"></script>

    <div class="container-fluid pb-5">
        <div class="row flex-nowrap">
            <div id="traverser-panel" class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark hidden">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white min-vh-100">
                    <div id="traverser-minimized" data-action="traverser-expand" role="button">
                        <img id="traverser-expand" src="../octicons/move-to-end.svg" style="filter: invert(1);" />
                        <div class="traverser-title">Traverser</div>
                    </div>
                    <div id="traverser-content">
                        <a id="traverser-collapse" data-action="traverser-collapse" role="button">
                            <img src="../octicons/move-to-start.svg" style="filter: invert(1);" />
                        </a>
                        <div class="traverser-title">Traverser</div>
                        <div id="traverser-tabs">
                            <select id="traverser-select">
                                <option value="0" disabled="disabled" selected="selected">----------</option>
                                <option value="-1">Open New Traverser</option>
                            </select>
                            <a data-action="traverser-close" role="button" title="Close current Traverser">
                                <img src="../octicons/trash.svg" style="filter: invert(1);" />
                            </a>
                        </div>
                        <div id="traversers">
                            
                        </div>
                    </div>
                </div>
            </div>
            <div id="scope" class="col">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <button class="btn btn-primary" type="button" data-action="prev-shot">
                                    -1
                                </button>
                            </li>
                            <li>
                                <div id="current-shot" title="Current Global Default Shot">No Current</div>
                            </li>
                            <li class="nav-item">
                                <button class="btn btn-primary" type="button" data-action="next-shot">
                                    +1
                                </button>
                            </li>
                        </ul>
                        <div class="navbar-brand window-title">Window Title</div>
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <button class="btn btn-primary" type="button" data-action="add-panel">
                                    Add Panel
                                </button>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-action="refresh" role="button">
                                    <img src="../octicons/sync.svg" />
                                </a>
                            </li>
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <img src="../octicons/three-bars.svg" />
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" data-action="import">Import</a></li>
                                    <li><a class="dropdown-item" data-action="export">Export</a></li>
                                    <li><a class="dropdown-item" data-action="settings">Settings</a></li>
                                    <li><a class="dropdown-item" data-action="reset">Reset</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div id="panels" class="grid-stack"></div>
            </div>
        </div>
    </div>

    <div id="traverser-preview">
        <div class="plot"></div>
        <div class="description"></div>
    </div>

    <div id="overlay"></div>

    <div class="container-fluid my-0 mx-0 px-0 fixed-bottom">    
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-1 my-0 border-top  mt-0 px-2"> 
                <div id="error-message" class="col-md-4 d-flex align-items-center justify-content-start mb-3 mb-md-0 me-md-auto"></div>
                <div id="status" class="col-md-4 text-body-secondary justify-content-center text-center"></div>
                <ul class="nav col-md-4 justify-content-end">
                    <li class="nav-item">
                        <a href="https://www.github.com" class="nav-link px-2">
                            <img src="../octicons/mark github.svg" />
                        </a>
                    </li>
                </ul>
        </footer>
    </div>

</body>
</html>
