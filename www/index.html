<html>
<head>
    <title>MDSplus Web Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        #title {
            font-size: 80px;
            text-align: center;
            border-bottom: 1px solid #888;
            font-weight: bold;
            font-family: Roboto, Arial, Helvetica, sans-serif;
            background-color: rgb(248, 249, 250);
        }
        #apps {
            width: 50%;
            margin: 0 auto;
            margin-top: 100px;
        }
        #title a,
        #apps a {
            color: black;
            text-decoration: none;
        }
        .app {
            width: 200px;
            height: 200px;
            border: 1px solid #888;
            border-radius: 5px;
            float: left;
            margin-right: 20px;
            background-color: #FFF;
        }
        .app:hover {
            background-color: rgb(248, 249, 250);
        }
        .app.disabled {
            cursor: default;
            opacity: 0.5;
        }
        .app .icon {
            width: 150px;
            height: 150px;
            margin-left: 24px;
            margin-top: 10px;
            border: 1px solid #333;
            background-color: #FFF;
        }
        .app .title {
            text-align: center;
            font-size: 26px;
        }
    </style>
</head>
<body>
    <div id="title">
        <a href="https://mdsplus.org">
            <span style="color: rgb(227, 148, 0)">MDS</span><span style="color: rgb(0, 136, 255)">plus</span>
        </a>
    </div>
    <div id="apps">
        <a class="app" href="./scope/">
            <img class="icon" src="scope.png">
            <div class="title">Scope</div>
        </a>
        <a class="app disabled" href="./traverser/" onclick="return false;">
            <div class="icon">
                <div style="text-align: center; font-size: 30px; rotate: -10deg; margin-top: 30px">Coming Soon</div>
            </div>
            <div class="title">Traverser</div>
        </a>
    </div>
</body>
</html>
