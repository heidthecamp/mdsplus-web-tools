<html>
<head>
    <style>
        body, html {
            margin: 0;
            padding: 0;
        }
        button:disabled {
            color: #888;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }

        .panel {
            width: 620px;
            height: 400px;
            float: left;
        }
        #overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        #overlay.shown {
            display: block;
        }
        #panel-form {
            width: 400px;
            margin: 100px auto 0 auto;
            padding: 20px;
            background: #888;
            border: 1px solid black;
        }
        .trace-form {
            display: none;
            border: 1px solid black;
            padding: 5px;
        }
        .trace-form.shown {
            display: block;
        }
    </style>

    <template id="panel-template">
        <div class="controls">
            <button data-action="edit">Edit</button> <button data-action="remove">Remove</button>
        </div>
        <b class="title"></b>
        <div class="plot">Loading...</div>
    </template>

    <template id="panel-form-template">
        <div id="panel-form">
            <label for="panel-title_expr">Title:</label> <input id="panel-title_expr" type="text" /> <input id="panel-title_expr-default" type="checkbox" /><br />
            <div id="trace-form-tabs">
                <button class="add-trace-button" data-action="add-trace">+</button>
            </div>
            <div id="trace-forms"></div>
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

    <template id="trace-form-template">
        <label for="trace-y_expr">Y Axis:</label> <input id="trace-y_expr" type="text" /> <input id="trace-y_expr-default" type="checkbox" /><br />
        <label for="trace-x_expr">X Axis:</label> <input id="trace-x_expr" type="text" /> <input id="trace-x_expr-default" type="checkbox" /><br />
        <label for="trace-tree">Tree:</label> <input id="trace-tree" type="text" /> <input id="trace-tree-default" type="checkbox" /><br />
        <label for="trace-shot">Shot:</label> <input id="trace-shot" type="text" /> <input id="trace-shot-default" type="checkbox" /><br />
        <label for="trace-default_node">Default Node:</label> <input id="trace-default_node" type="text" /> <input id="trace-default_node-default" type="checkbox" /><br />
    </template>

    <template id="global-defaults-form-template">
        <div id="panel-form">
            <h1>Global Defaults</h1>
            <label for="global-defaults-title_expr">Title:</label> <input id="global-defaults-title_expr" type="text" /><br />
            <label for="global-defaults-y_expr">Y Axis:</label> <input id="global-defaults-y_expr" type="text" /><br />
            <label for="global-defaults-x_expr">X Axis:</label> <input id="global-defaults-x_expr" type="text" /><br />
            <label for="global-defaults-tree">Tree:</label> <input id="global-defaults-tree" type="text" /><br />
            <label for="global-defaults-shot">Shot:</label> <input id="global-defaults-shot" type="text" /><br />
            <label for="global-defaults-default_node">Default Node:</label> <input id="global-defaults-default_node" type="text" /><br />
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

</head>
<body>
    <script type="module" src="index.js"></script>

    <div id="overlay"></div>

    <button data-action="global-defaults">Global Defaults</button> <button data-action="add-panel">Add Panel</button> <button id="refresh" data-action="refresh">Refresh</button>
    <div id="panels"></div>
</body>
</html>
