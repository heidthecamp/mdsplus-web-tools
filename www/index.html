<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./gridstack-all.js"></script>
    <link href="./gridstack.min.css" rel="stylesheet"></link>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            --bs-gutter-x: 0.5rem;
            .container {
                --bs-gutter-x: 0.5rem;
                --bs-gutter-y: 0;
                margin: 10px;
            }
        }
        button:disabled {
            color: #888;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }
        /* .grid-stack-item {
        } */
        .grid-stack-item-content {
            display: flex;
            flex-direction: column;
        }
        /* .panel {
            background-color: black;
        } */
        .plot {
            flex: 1;
            height: 100%;
        }
        .panel .navbar {
            flex: none;
            padding: 0;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        #overlay.shown {
            display: block;
        }
        #panel-form {
            width: 400px;
            margin: 100px auto 0 auto;
            padding: 20px;
            background: #888;
            border: 1px solid black;
        }
        .trace-form {
            display: none;
            border: 1px solid black;
            padding: 5px;
        }
        .trace-form.shown {
            display: block;
        }
        .column {
            flex-direction: column;
        }
        .nav-link:hover {
            opacity: 0.5;
        }
    </style>

    <template id="panel-template">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-brand title"></div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="edit" role="button">
                            <img src="octicons/pencil.svg" />
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="remove" role="button">
                            <img src="octicons/trash.svg" />
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                             <img src="octicons/graph.svg" />
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" data-action="auto-x-y">Auto X & Y</a></li>
                            <li><a class="dropdown-item" data-action="auto-x">Auto X</a></li>
                            <li><a class="dropdown-item" data-action="auto-y">Auto Y</a></li>
                            <li><a class="dropdown-item" data-action="all-x-auto-y">All X Auto Y</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- <b class="title"></b> -->
        <div class="plot">Loading...</div>
    </template>

    <template id="panel-form-template">
        <div id="panel-form">
            <input tabindex="0" id="panel-title_expr-default" type="checkbox" /> <label for="panel-title_expr">Title:</label> <input tabindex="1" id="panel-title_expr" type="text" /> <br />
            <input tabindex="2" id="panel-y-min-default" type="checkbox" /> <label for="panel-y-min">y-min:</label> <input tabindex="3" id="panel-y-min" type="number" /> <br />
            <input tabindex="4" id="panel-y-max-default" type="checkbox" /> <label for="panel-y-max">y-max:</label> <input tabindex="5" id="panel-y-max" type="number" /> <br />
            <input tabindex="6" id="panel-x-min-default" type="checkbox" /> <label for="panel-x-min">x-min:</label> <input tabindex="7" id="panel-x-min" type="number" /> <br />
            <input tabindex="8" id="panel-x-max-default" type="checkbox" /> <label for="panel-x-max">x-max:</label> <input tabindex="9" id="panel-x-max" type="number" /> <br />
            <input tabindex="10" id="panel-use-canvas-default" type="checkbox" /> <label for="panel-use-canvas">canvas:</label> <input tabindex="11" id="panel-use-canvas" type="checkbox" /> <br />
            <div id="trace-form-tabs">
                <button class="add-trace-button" data-action="add-trace">+</button>
            </div>
            <div style="float: left; padding-top: 5px;">
                <input tabindex="12" id="trace-y_expr-default" type="checkbox" style="height: 29px;" /> <br />
                <input tabindex="14" id="trace-x_expr-default" type="checkbox" style="height: 29px;" /> <br />
                <input tabindex="16" id="trace-tree-default" type="checkbox" style="height: 29px;" /> <br />
                <input tabindex="18" id="trace-shot-default" type="checkbox" style="height: 29px;" /> <br />
                <input tabindex="20" id="trace-default_node-default" type="checkbox" style="height: 29px;" /> <br />
            </div>
            <div id="trace-forms" style="float: right;"></div>
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

    <template id="trace-form-template">
        <label for="trace-y_expr">Y Axis:</label> <input tabindex="13" id="trace-y_expr" type="text" /> <br />
        <label for="trace-x_expr">X Axis:</label> <input tabindex="15" id="trace-x_expr" type="text" /> <br />
        <label for="trace-tree">Tree:</label> <input tabindex="17" id="trace-tree" type="text" /> <br />
        <label for="trace-shot">Shot:</label> <input tabindex="19" id="trace-shot" type="text" /> <br />
        <label for="trace-default_node">Default Node:</label> <input tabindex="21" id="trace-default_node" type="text" /> <br />
        <label for="trace-color">Trace Color:</label> <input tabindex="23" id="trace-color" type="text" />
    </template>

    <template id="global-defaults-form-template">
        <div id="panel-form">
            <h1>Global Defaults</h1>
            <label for="global-defaults-title_expr">Title:</label> <input id="global-defaults-title_expr" type="text" /><br />
            <label for="global-defaults-y_expr">Y Axis:</label> <input id="global-defaults-y_expr" type="text" /><br />
            <label for="global-defaults-y-min">y-min:</label> <input id="global-defaults-y-min" type="number" /> <br />
            <label for="global-defaults-y-max">y-max:</label> <input id="global-defaults-y-max" type="number" /> <br />
            <label for="global-defaults-x_expr">X Axis:</label> <input id="global-defaults-x_expr" type="text" /><br />
            <label for="global-defaults-x-min">x-min:</label> <input id="global-defaults-x-min" type="number" /> <br />
            <label for="global-defaults-x-max">x-max:</label> <input id="global-defaults-x-max" type="number" /> <br />
            <label for="global-defaults-tree">Tree:</label> <input id="global-defaults-tree" type="text" /><br />
            <label for="global-defaults-shot">Shot:</label> <input id="global-defaults-shot" type="text" /><br />
            <label for="global-defaults-default_node">Default Node:</label> <input id="global-defaults-default_node" type="text" /><br />
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

</head>
<body>
    <script type="module" src="index.js"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <div style="width: 56px;"></div>
            <div class="navbar-brand window-title">Window Title</div>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" data-action="refresh" role="button">
                        <img src="./octicons/sync.svg" />
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" data-action="add-panel" role="button">
                         <img src="./octicons/diff-added.svg" />
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="./octicons/gear.svg" />
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                    
                    
                        <li><a class="dropdown-item" data-action="global-defaults">Global Defaults</a></li>
                        <li>
                            <span class="dropdown-item">
                                <label for="use-canvas">Canvas</label> <input type="checkbox" id="use-canvas" />
                            </span>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div id="panels" class="grid-stack">
    </div>

    <div id="overlay"></div>

</body>
</html>
