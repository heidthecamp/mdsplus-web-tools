<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            --bs-gutter-x: 0.5rem;
            .container {
                --bs-gutter-x: 0.5rem;
                --bs-gutter-y: 0;
                margin: 10px;
            }
        }
        button:disabled {
            color: #888;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }
        .panel {
            display: flex;
            flex-direction: column;
        }
        .panel .plot {
            flex: 1;
            height: 100%;
        }
        .panel .navbar {
            flex: none;
            padding: 0;
        }
        #overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        #overlay.shown {
            display: block;
        }
        #panel-form {
            width: 400px;
            margin: 100px auto 0 auto;
            padding: 20px;
            background: #888;
            border: 1px solid black;
        }
        .trace-form {
            display: none;
            border: 1px solid black;
            padding: 5px;
        }
        .trace-form.shown {
            display: block;
        }
        .column {
            flex-direction: column;
        }
    </style>

    <template id="panel-template">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-brand title"></div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="edit" role="button">Edit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="remove" role="button">Remove</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Auto Align
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" data-action="auto-x">Auto X</a></li>
                            <li><a class="dropdown-item" data-action="auto-y">Auto Y</a></li>
                            <li><a class="dropdown-item" data-action="all-x-auto-y">All X Auto Y</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- <b class="title"></b> -->
        <div class="plot">Loading...</div>
    </template>

    <template id="panel-form-template">
        <div id="panel-form">
            <label for="panel-title_expr">Title:</label> <input id="panel-title_expr" type="text" /> <input id="panel-title_expr-default" type="checkbox" /><br />
            <label for="panel-y-min">y-min:</label> <input id="panel-y-min" type="number" /> <input id="panel-y-min-default" type="checkbox" /><br />
            <label for="panel-y-max">y-max:</label> <input id="panel-y-max" type="number" /> <input id="panel-y-max-default" type="checkbox" /><br />
            <label for="panel-x-min">x-min:</label> <input id="panel-x-min" type="number" /> <input id="panel-x-min-default" type="checkbox" /><br />
            <label for="panel-x-max">x-max:</label> <input id="panel-x-max" type="number" /> <input id="panel-x-max-default" type="checkbox" /><br />
            <div id="trace-form-tabs">
                <button class="add-trace-button" data-action="add-trace">+</button>
            </div>
            <div id="trace-forms"></div>
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

    <template id="trace-form-template">
        <label for="trace-y_expr">Y Axis:</label> <input id="trace-y_expr" type="text" /> <input id="trace-y_expr-default" type="checkbox" /><br />
        <label for="trace-x_expr">X Axis:</label> <input id="trace-x_expr" type="text" /> <input id="trace-x_expr-default" type="checkbox" /><br />
        <label for="trace-tree">Tree:</label> <input id="trace-tree" type="text" /> <input id="trace-tree-default" type="checkbox" /><br />
        <label for="trace-shot">Shot:</label> <input id="trace-shot" type="text" /> <input id="trace-shot-default" type="checkbox" /><br />
        <label for="trace-default_node">Default Node:</label> <input id="trace-default_node" type="text" /> <input id="trace-default_node-default" type="checkbox" /><br />
        <label for="trace-color">Trace Color:</label> <input id="trace-color" type="text" />
    </template>

    <template id="global-defaults-form-template">
        <div id="panel-form">
            <h1>Global Defaults</h1>
            <label for="global-defaults-title_expr">Title:</label> <input id="global-defaults-title_expr" type="text" /><br />
            <label for="global-defaults-y_expr">Y Axis:</label> <input id="global-defaults-y_expr" type="text" /><br />
            <label for="global-defaults-y-min">y-min:</label> <input id="global-defaults-y-min" type="number" /> <br />
            <label for="global-defaults-y-max">y-max:</label> <input id="global-defaults-y-max" type="number" /> <br />
            <label for="global-defaults-x_expr">X Axis:</label> <input id="global-defaults-x_expr" type="text" /><br />
            <label for="global-defaults-x-min">x-min:</label> <input id="global-defaults-x-min" type="number" /> <br />
            <label for="global-defaults-x-max">x-max:</label> <input id="global-defaults-x-max" type="number" /> <br />
            <label for="global-defaults-tree">Tree:</label> <input id="global-defaults-tree" type="text" /><br />
            <label for="global-defaults-shot">Shot:</label> <input id="global-defaults-shot" type="text" /><br />
            <label for="global-defaults-default_node">Default Node:</label> <input id="global-defaults-default_node" type="text" /><br />
            <button data-action="save">Save</button> <button data-action="reset">Reset</button> <button data-action="cancel">Cancel</button>
        </div>
    </template>

</head>
<body>
    <script type="module" src="index.js"></script>

    <div id="overlay"></div>

    <div class="container text-center align-left">

        <button type="button" class="btn btn-primary" data-action="global-defaults">Global Defaults</button>
        <button type="button" class="btn btn-primary"  data-action="add-panel">Add Panel</button>
        <button type="button" class="btn btn-primary"  id="refresh" data-action="refresh">Refresh</button>
        <label for="parallel">Parallel</label> <input type="checkbox" id="parallel" checked="checked" />
        <label for="shrink-to-fit">Shrink to Fit</label> <input type="checkbox" id="shrink-to-fit" />
    </div>
    <div id="panels">
    </div>
</body>
</html>
