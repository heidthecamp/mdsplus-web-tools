<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./gridstack-all.js"></script>
    <link href="./gridstack.min.css" rel="stylesheet"></link>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            --bs-gutter-x: 0.5rem;
            .container {
                --bs-gutter-x: 0.5rem;
                --bs-gutter-y: 0;
                margin: 10px;
            }
        }
        button:disabled {
            color: #888;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }
        /* .grid-stack-item {
        } */
        .grid-stack-item-content {
            display: flex;
            flex-direction: column;
            border: 1px solid #CCC;
        }
        /* .panel {
        } */
        .plot {
            flex: 1;
            height: 100%;
        }
        .panel .navbar {
            flex: none;
            padding: 0;
        }
        .handle {
            flex: 1;
            height: 40px; /* HACK: Improve */
            cursor: pointer;
            min-width: 10px;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }
        #overlay.shown {
            display: block;
        }
        #panel-form, #global-defaults-form {
            width: 600px;
            margin: 100px auto 0 auto;
            padding: 20px;
            padding-right: 40px;
            border: 1px solid black;
            border-radius: 20px;
            background-color: white;
        }
        #panel-form input[type="checkbox"] {
            margin-top: 13px;
        }
        .panel-defaults input[type="checkbox"] {
            margin-top: 25px !important; /* HACK: Align properly */
        }
        .trace-form {
            display: none;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .global-default-form {
            display: none;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .trace-form.shown {
            display: block;
        }
        .column {
            flex-direction: column;
        }
        .nav-link:hover {
            opacity: 0.5;
        }
        .error {
            text-align: center;
            color: red;
            font-size: 40px;
            margin-top: 20px;
        }
    </style>

    <template id="panel-template">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-brand title"></div>
                <div class="handle"></div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="edit" role="button">
                            <img src="octicons/pencil.svg" />
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" type="button" data-action="remove" role="button">
                            <img src="octicons/trash.svg" />
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                             <img src="octicons/graph.svg" />
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" data-action="auto-x-y">Auto X & Y</a></li>
                            <li><a class="dropdown-item" data-action="auto-x">Auto X</a></li>
                            <li><a class="dropdown-item" data-action="auto-y">Auto Y</a></li>
                            <li><a class="dropdown-item" data-action="all-x-auto-y">All X Auto Y</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="plot">Loading...</div>
    </template>

    <template id="panel-form-template">
        <div id="panel-form" class="container-fluid">
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="0" id="panel-title_expr-default" type="checkbox">
                </div>
                <label for="panel-title_expr" class="col-sm-2 col-form-label">Title</label>
                <div class="col-sm-9">
                    <input tabindex="1" class="form-control" id="panel-title_expr" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="2" id="panel-y-min-default" type="checkbox" />
                </div>
                <label for="panel-y-min" class="col-sm-2 col-form-label">Y Min</label>
                <div class="col-sm-9">
                    <input tabindex="3" class="form-control" id="panel-y-min" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="4" id="panel-y-max-default" type="checkbox" />
                </div>
                <label for="panel-y-min" class="col-sm-2 col-form-label">Y Max</label>
                <div class="col-sm-9">
                    <input tabindex="5" class="form-control" id="panel-y-max" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="6" id="panel-x-min-default" type="checkbox" />
                </div>
                <label for="panel-y-min" class="col-sm-2 col-form-label">X Min</label>
                <div class="col-sm-9">
                    <input tabindex="7" class="form-control" id="panel-x-min" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="8" id="panel-x-max-default" type="checkbox" />
                </div>
                <label for="panel-y-min" class="col-sm-2 col-form-label">X Max</label>
                <div class="col-sm-9">
                    <input tabindex="9" class="form-control" id="panel-x-max" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-1">
                    <input tabindex="10" id="panel-use-canvas-default" type="checkbox" />
                </div>
                <label for="panel-y-min" class="col-sm-2 col-form-label">Canvas</label>
                <div class="col-sm-9">
                    <input tabindex="11" id="panel-use-canvas" type="checkbox" />
                </div>
            </div>
            
            <div class="row mb-3">
                <ul class="nav nav-tabs" id="trace-form-tabs">
                    <li class="nav-item">
                        <a class="nav-link" data-action="add-trace" ><img src="octicons/diff-added.svg"  /></a>
                    </li>
                    <li class="nav-item">

                    </li>
                </ul>
            </div>
            
            <div class="row mb-3">
                <div class="col-sm-1 panel-defaults">
                    <div class="row mb-3">
                        <input tabindex="12" id="trace-y_expr-default" type="checkbox" /> <br />
                    </div>
                    <div class="row mb-3">
                        <input tabindex="14" id="trace-x_expr-default" type="checkbox" /> <br />
                    </div>
                    <div class="row mb-3">
                        <input tabindex="16" id="trace-tree-default" type="checkbox" /> <br />
                    </div>
                    <div class="row mb-3">
                        <input tabindex="18" id="trace-shot-default" type="checkbox" /> <br />
                    </div>
                    <div class="row mb-3">
                        <input tabindex="20" id="trace-default_node-default" type="checkbox" /> <br />
                    </div>
                </div>
                <div id="trace-forms" class="col-sm-11"></div>
            </div>
            <div class="row">
                <div class="container-fluid">
                    <button type="button" data-action="save" class="btn btn-primary">Save</button>
                    <button type="button" data-action="reset" class="btn btn btn-secondary">Reset</button>
                    <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </template>

    <template id="trace-form-template">
        <div class="row mb-3">
            <label for="trace-y_expr" class="col-sm-3 col-form-label">Y Axis</label>
            <div class="col-sm-9">
                <input tabindex="13" class="form-control" id="trace-y_expr" type="text" />
            </div>
        </div>
        <div class="row mb-3">
            <label for="trace-x_expr" class="col-sm-3 col-form-label">X Axis</label>
            <div class="col-sm-9">
                <input tabindex="15" class="form-control" id="trace-x_expr" type="text" />
            </div>
        </div>
        <div class="row mb-3">
            <label for="trace-tree" class="col-sm-3 col-form-label">Tree</label>
            <div class="col-sm-9">
                <input tabindex="17" class="form-control" id="trace-tree" type="text" />
            </div>
        </div>
        <div class="row mb-3">
            <label for="trace-shot" class="col-sm-3 col-form-label">Shot</label>
            <div class="col-sm-9">
                <input tabindex="19" class="form-control" id="trace-shot" type="text" />
            </div>
        </div>
        <div class="row mb-3">
            <label for="trace-default_node" class="col-sm-3 col-form-label">Default Node</label>
            <div class="col-sm-9">
                <input tabindex="21" class="form-control" id="trace-default_node" type="text" />
            </div>
        </div>
        <div class="row mb-3">
            <label for="trace-color" class="col-sm-3 col-form-label">Trace Color</label>
            <div class="col-sm-9">
                <input tabindex="23" class="form-control" id="trace-color" type="text" />
            </div>
        </div>
    </template>

    <template id="global-defaults-form-template">
        <div id="global-defaults-form" class="container-fluid">
            <legend for="panel-default-form">Global Panel Defaults</legend>
            <fieldset id="panel-default-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="global-defaults-title_expr" class="col-sm-3 col-form-label">Title:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-title_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-y-min"  class="col-sm-3 col-form-label">Y Min:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-y-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-y-max"  class="col-sm-3 col-form-label">Y Max:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-y-max" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x-min"  class="col-sm-3 col-form-label">X Min:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x-max"  class="col-sm-3 col-form-label">X Max:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x-max" class="form-control" type="text" />
                    </div>
                </div>
            </fieldset>
            <legend for="trace-default-form">Global Trace Defaults</legend>
            <fieldset id="trace-default-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="global-defaults-y_expr"  class="col-sm-3 col-form-label">Y Axis:</label>

                    <div class="col-sm-9">
                        <input id="global-defaults-y_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-x_expr"  class="col-sm-3 col-form-label">X Axis:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-x_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-tree"  class="col-sm-3 col-form-label">Tree:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-tree" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-shot"  class="col-sm-3 col-form-label">Shot:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-shot" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="global-defaults-default_node"  class="col-sm-3 col-form-label">Default Node:</label>
                    <div class="col-sm-9">
                        <input id="global-defaults-default_node"  class="form-control" type="text" />
                    </div>
            </fieldset>
            <div class="row">
                <div class="container-fluid">
                    <button type="button" data-action="save" class="btn btn-primary">Save</button>
                    <button type="button" data-action="reset" class="btn btn-primary">Reset</button>
                    <button type="button" data-action="cancel" class="btn btn-primary">Cancel</button>
                </div>
            </div>
        </div>
    </template>

</head>
<body>
    <script type="module" src="index.js"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <div style="width: 56px;"></div>
            <div class="navbar-brand window-title">Window Title</div>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-action="upload" role="button">
                        <img src="./octicons/upload.svg" />
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-action="refresh" role="button">
                        <img src="./octicons/sync.svg" />
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-action="add-panel" role="button">
                         <img src="./octicons/diff-added.svg" />
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="./octicons/gear.svg" />
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                    
                    
                        <li><a class="dropdown-item" data-action="settings">Settings</a></li>
                        <li>
                            <span class="dropdown-item" onclick="this.querySelector('input[type=checkbox]').click()">
                                <label for="use-canvas" style="pointer-events:none">Canvas</label> <input type="checkbox" id="use-canvas" style="pointer-events:none"/>
                            </span>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div id="panels" class="grid-stack">
    </div>

    <div id="overlay"></div>

</body>
</html>
