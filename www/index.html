<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />

    <script src="./dist/external/popper.min.js"></script>

    <!-- Bootstrap -->

    <!-- Templates -->
    <template id="toast-error-template">
        <div class="toast align-items-center text-bg-danger border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </template>
    
    <template id="confirm-form-template">
        <form class="confirm-form form small-form container-fluid">
            <div class="row">
                <div id="message" class="container"></div>
            </div>
            <div class="row">
                <div class="container">
                    <button type="submit" data-action="save" class="btn btn-danger">Confirm</button>
                    <button type="button" data-action="cancel" class="btn btn-primary">Cancel</button>
                </div>
            </div>
        </form>
    </template>

    <template id="node-edit-form-template">
        <form class="form node-edit-form container-fluid">
            <img class="icon exit-icon" src="./dist/external/octicons/x-circle.svg" data-action="close" role="button" />
            <div class="row mb-2">
                <div class="title">
                    <span data-display="verb"></span>
                    <span data-display="path"></span>
                </div>
                <div class="subtitle">
                    <span data-display="tree"></span>
                    shot
                    <span data-display="shot"></span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="accordion" id="node-edit-accordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#node-edit-collapse-data" aria-expanded="true" aria-controls="node-edit-collapse-data">
                                Data
                            </button>
                        </h2>
                        <div id="node-edit-collapse-data" class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                <div class="row mb-3">
                                    <div class="col-sm-4">
                                        <select class="form-control" id="traverser-data-type" value="expression">
                                            <option value="expression">Expression</option>
                                            <option value="text">Text</option>
                                            <option value="signal">Signal</option>
                                            <option value="array">Array</option>
                                            <option value="action">Action</option>
                                            <option value="dispatch">Dispatch</option>
                                            <option value="window">Window</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row container-fluid mb-3">
                                    <textarea id="node-edit-form-data" class="form-control"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#node-edit-collapse-flags" aria-expanded="false" aria-controls="node-edit-collapse-flags">
                                Usage & Status Flags
                            </button>
                        </h2>
                        <div id="node-edit-collapse-flags" class="accordion-collapse collapse">
                            <div class="accordion-body">
                                <div class="row mb-3">
                                    <label for="node-edit-form-usage" class="col-sm-2 col-form-label">Usage</label>
                                    <div class="col-sm-4">
                                        <select class="form-control" id="node-edit-form-usage">
                                            <option value="ANY">Any</option>
                                            <option value="STRUCTURE">Structure</option>
                                            <option value="ACTION">Action</option>
                                            <option value="DEVICE">Device</option>
                                            <option value="DISPATCH">Dispatch</option>
                                            <option value="NUMERIC">Numeric</option>
                                            <option value="SIGNAL">Signal</option>
                                            <option value="TASK" disabled="disabled">Task</option>
                                            <option value="TEXT">Text</option>
                                            <option value="WINDOW">Window</option>
                                            <option value="AXIS">Axis</option>
                                            <option value="SUBTREE">Subtree</option>
                                            <option value="COMPOUND_DATA">Compound Data</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-3">
                                        <input id="node-edit-form-state" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-state" class="col-form-label">STATE</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-parent_state" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-parent_state" class="col-form-label">PARENT_STATE</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-essential" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-essential" class="col-form-label">ESSENTIAL</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-cached" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-cached" class="col-form-label">CACHED</label>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-3">
                                        <input id="node-edit-form-versions" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-versions" class="col-form-label">VERSIONS</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-segmented" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-segmented" class="col-form-label">SEGMENTED</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-setup_information" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-setup_information" class="col-form-label">SETUP_INFORMATION</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-write_once" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-write_once" class="col-form-label">WRITE_ONCE</label>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-3">
                                        <input id="node-edit-form-compressible" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-compressible" class="col-form-label">COMPRESSIBLE</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-do_not_compress" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-do_not_compress" class="col-form-label">DO_NOT_COMPRESS</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-compress_on_put" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-compress_on_put" class="col-form-label">COMPRESS_ON_PUT</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-no_write_model" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-no_write_model" class="col-form-label">NO_WRITE_MODEL</label>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-3">
                                        <input id="node-edit-form-no_write_shot" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-no_write_shot" class="col-form-label">NO_WRITE_SHOT</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-path_reference" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-path_reference" class="col-form-label">PATH_REFERENCE</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-nid_reference" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-nid_reference" class="col-form-label">NID_REFERENCE</label>
                                    </div>

                                    <div class="col-sm-3">
                                        <input id="node-edit-form-include_in_pulse" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-include_in_pulse" class="col-form-label">INCLUDE_IN_PULSE</label>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-sm-3">
                                        <input id="node-edit-form-compress_segments" type="checkbox" class="me-1" />
                                        <label for="node-edit-form-compress_segments" class="col-form-label">COMPRESS_SEGMENTS</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#node-edit-collapse-xnci" aria-expanded="false" aria-controls="node-edit-collapse-xnci">
                                Extended Metadata (XNCI)
                            </button>
                        </h2>
                        <div id="node-edit-collapse-xnci" class="accordion-collapse collapse">
                            <div class="accordion-body">
                                <div class="row mb-3">
                                    <div class="col-sm-5">
                                        Name
                                    </div>
                                    <div class="col-sm-5">
                                        Value
                                    </div>
                                    <div class="col-sm-2 only-write">
                                        <button class="btn btn-primary">Add</button>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-5">
                                        <input class="form-control" type="text" value="MdsResample" />
                                    </div>
                                    <div class="col-sm-5">
                                        <input class="form-control" type="text" value="MinMax" />
                                    </div>
                                    <div class="col-sm-2 only-write">
                                        <button class="btn btn-danger">Delete</button>
                                    </div>
                                </div>
                                <div class="row mb-3 only-write">
                                    <div class="col-sm-5">
                                        <input class="form-control" type="text" placeholder="Name" />
                                    </div>
                                    <div class="col-sm-5">
                                        <input class="form-control" type="text" placeholder="Value" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="container-fluid only-write">
                    <button type="button" data-action="save" class="btn btn-primary">Save</button>
                    <button type="button" data-action="apply" class="btn btn btn-secondary">Apply</button>
                    <button type="button" data-action="reset" class="btn btn btn-secondary">Reset</button>
                    <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                </div>
                <div class="container-fluid only-read">
                    <button type="button" data-action="cancel" class="btn btn btn-secondary">Close</button>
                </div>
            </div>
        </form>
    </template>

    <template id="traverser-node-template">
        <div class="node">
            <div class="item">
                <div class="handle" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-html="true">
                    <div class="icon expand-icon"></div>
                    <span class="name"></span>
                </div>
                <a class="context-menu dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img class="icon" src="./dist/external/octicons/gear.svg" width="16" />
                </a>
                <ul class="dropdown-menu dropright">
                    <!-- <li class="only-signal"><a class="dropdown-item" role="button" data-action="">Preview</a></li> -->
                    <li class="only-signal">
                        <a class="dropdown-item" role="button" data-action="traverser-add-to-dashboard">Add to Dashboard</a>
                    </li>
                    <li class="only-signal"><hr /></li>

                    <li class="only-write">
                        <a class="dropdown-item" role="button" data-action="traverser-toggle-on-off">Toggle On/Off</a>
                    </li>
                    <li>
                        <a class="dropdown-item" role="button" data-action="traverser-display">Display</a>
                    </li>
                    <li class="only-write">
                        <a class="dropdown-item" role="button" data-action="traverser-modify">Modify</a>
                    </li>

                    <!-- Only when open for edit-->
                    <li class="only-edit"><hr /></li>
                    <li class="only-edit">
                        <a class="dropdown-item" role="button" data-action="">Add Member</a>
                    </li>
                    <li class="only-edit">
                        <a class="dropdown-item" role="button" data-action="">Add Child</a>
                    </li>
                    <li class="only-edit">
                        <a class="dropdown-item text-danger" role="button" data-action="">Rename</a>
                    </li>
                    <li class="only-edit">
                        <a class="dropdown-item text-danger" role="button" data-action="">Remove</a>
                    </li>
                </ul>
            </div>
            <div class="members"></div>
            <div class="children"></div>
        </div>
    </template>

    <template id="traverser-open-form-template">
        <form id="traverser-open-form" class="form small-form">
            <img class="icon exit-icon" src="./dist/external/octicons/x-circle.svg" data-action="close" role="button" />
            <div class="row mb-3">
                <label for="traverser-tree" class="col-sm-2 col-form-label">Tree</label>
                <div class="col-sm-9">
                    <input class="form-control" id="traverser-tree" type="text" />
                </div>
            </div>
            <div class="row mb-3">
                <label for="traverser-shot" class="col-sm-2 col-form-label">Shot</label>
                <div class="col-sm-9">
                    <input class="form-control" id="traverser-shot" type="text" />
                </div>
            </div>
            <!--
            <div class="row mb-3">
                <label for="traverser-mode" class="col-sm-2 col-form-label">Mode</label>
                <div class="col-sm-9">
                    <input class="form-control" id="traverser-mode" type="text" />
                </div>
            </div>
            -->
            <div class="row">
                <div class="container-fluid">
                    <input type="submit" data-action="save" class="btn btn-primary" value="Open" />
                    <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                </div>
            </div>
        </form>
    </template>

    <template id="traverser-reveal-form-template">
        <form id="traverser-reveal-form" class="form small-form">
            <img class="icon exit-icon" src="./dist/external/octicons/x-circle.svg" data-action="close" role="button" />
            <div class="row mb-3">
                <label for="reveal-node" class="col-sm-2 col-form-label">Node</label>
                <div class="col-sm-9">
                    <input class="form-control" id="reveal-node" type="text" />
                </div>
            </div>
            <div class="row">
                <div class="container-fluid">
                    <input type="submit" data-action="save" class="btn btn-primary" value="Open" />
                    <button type="button" data-action="cancel" class="btn btn btn-secondary">Cancel</button>
                </div>
            </div>
        </form>
    </template>

                </div>
                <div class="col-sm-1">
                    <img class="icon" src="./dist/external/octicons/info.svg"
                        data-bs-toggle="tooltip" data-bs-placement="top"
                        title="Colors will be inverted when using the dark theme" />
                </div>
            </div>
        </li>
    </template>

    <template id="settings-form-template">
        <div class="settings-form form container-fluid">
            <img class="icon exit-icon" src="./dist/external/octicons/x-circle.svg" data-action="close" role="button" />
            <legend for="settings-form-form">Settings</legend>
            <fieldset id="settings-form-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="settings-form-title_expr" class="col-sm-3 col-form-label">Title:</label>
                    <div class="col-sm-9">
                        <input id="settings-form-title_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="settings-form-resample" class="col-sm-3 col-form-label">Resample:</label>
                    <div class="col-sm-9">
                        <input id="settings-form-resample" type="checkbox" />
                    </div>
                </div>
            </fieldset>
            <legend for="panel-defaults-form">Global Panel Defaults</legend>
            <fieldset id="panel-defaults-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="panel-defaults-form-title_expr" class="col-sm-3 col-form-label">Title:</label>
                    <div class="col-sm-9">
                        <input id="panel-defaults-form-title_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="panel-defaults-form-y-min"  class="col-sm-3 col-form-label">Y Min:</label>
                    <div class="col-sm-9">
                        <input id="panel-defaults-form-y-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="panel-defaults-form-y-max"  class="col-sm-3 col-form-label">Y Max:</label>
                    <div class="col-sm-9">
                        <input id="panel-defaults-form-y-max" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="panel-defaults-form-x-min"  class="col-sm-3 col-form-label">X Min:</label>
                    <div class="col-sm-9">
                        <input id="panel-defaults-form-x-min" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="panel-defaults-form-x-max"  class="col-sm-3 col-form-label">X Max:</label>
                    <div class="col-sm-9">
                        <input id="panel-defaults-form-x-max" class="form-control" type="text" />
                    </div>
                </div>
            </fieldset>
            <legend for="trace-defaults-form">Global Trace Defaults</legend>
            <fieldset id="trace-defaults-form" class="col-sm-11">
                <div class="row mb-3">
                    <label for="trace-defaults-form-y_expr"  class="col-sm-3 col-form-label">Y Axis:</label>

                    <div class="col-sm-9">
                        <input id="trace-defaults-form-y_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="trace-defaults-form-x_expr"  class="col-sm-3 col-form-label">X Axis:</label>
                    <div class="col-sm-9">
                        <input id="trace-defaults-form-x_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="trace-defaults-form-tree"  class="col-sm-3 col-form-label">Tree:</label>
                    <div class="col-sm-9">
                        <input id="trace-defaults-form-tree" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="trace-defaults-form-shot_expr"  class="col-sm-3 col-form-label">Shot:</label>
                    <div class="col-sm-9">
                        <input id="trace-defaults-form-shot_expr" class="form-control" type="text" />
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="trace-defaults-form-default_node_expr"  class="col-sm-3 col-form-label">Default Node:</label>
                    <div class="col-sm-9">
                        <input id="trace-defaults-form-default_node_expr"  class="form-control" type="text" />
                    </div>
            </fieldset>
            <div class="row">
                <div class="container-fluid">
                    <button type="button" data-action="save" class="btn btn-primary">Save</button>
                    <button type="button" data-action="reset" class="btn btn-primary">Reset</button>
                    <button type="button" data-action="cancel" class="btn btn-primary">Cancel</button>
                </div>
            </div>
        </div>
    </template>

</head>
<body>

    <main>
        <nav class="header navbar navbar-expand-lg py-0 justify-content-between">
            <div class="container-fluid">
                <a href="https://mdsplus.org" target="_blank" class="navbar-brand logo">
                    <span style="color: rgb(227, 148, 0); font-weight: bold;">MDS</span><span style="color: rgb(0, 136, 255)">plus</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="#scope" class="nav-link active"><!-- TODO: Mark the correct "page" as active -->
                                Scope
                            </a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" title="Coming Soon!">
                                Traverser
                            </span>
                        </li>
                    </ul>
                </div>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="https://mdsplus.readthedocs.io" target="_blank" class="nav-link">
                            Documentation
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-action="toggle-theme">
                            <img class="icon only-light" src="./dist/external/octicons/moon.svg" />
                            <img class="icon only-dark" src="./dist/external/octicons/sun.svg" />
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="https://www.github.com/MDSplus/mdsplus" target="_blank" class="nav-link">
                            <img class="icon" src="./dist/external/octicons/github-octocat.svg" />
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <div id="scope-root" class="container-fluid position-relative">
            <div class="row flex-nowrap">
                <div id="traverser-sidebar" class="hidden col-auto col-md-3 col-xl-2 px-sm-2 px-0 position-relative bg-body-tertiary">
                    <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 min-vh-100">
                        <div class="header" data-action="traverser-sidebar-toggle">
                            <img class="icon open-sidebar-icon" src="./dist/external/octicons/move-to-end.svg" />
                            <img class="icon close-sidebar-icon" src="./dist/external/octicons/move-to-start.svg" />
                            <div class="title">Traverser</div>
                        </div>
                        <div class="content">
                            <div class="d-flex">
                                <select id="traverser-select" class="flex-grow-1">
                                    <option value="0" disabled="disabled" selected="selected">----------</option>
                                    <option value="-1">Open New Traverser</option>
                                </select>
                                <a class="flex-shrink-0 ps-2" data-bs-toggle="dropdown" role="button" title="traverser menu">
                                    <img class="icon" src="./dist/external/octicons/three-bars.svg" />
                                </a>
                                <ul class="dropdown-menu dropdown-menu-middle">
                                    <li><a class="dropdown-item" role="button" data-action="traverser-sidebar-open-tree">Open</a></li>
                                    <li><a class="dropdown-item" role="button" data-action="traverser-sidebar-reveal">Reveal Node</a></li>
                                    <li><hr /></li>
                                    <li><a class="dropdown-item text-danger" role="button" data-action="traverser-sidebar-close-tree">Close</a></li>
                                    <li><a class="dropdown-item text-danger" role="button" data-action="traverser-sidebar-close-all">Close All</a></li>
                                </ul>
                            </div>
                            <div id="traversers"></div>
                        </div>
                    </div>
                </div>
                <div class="col scope">
                    <nav class="navbar navbar-expand-lg bg-body-tertiary">
                        <div class="shot-scrubber container-fluid">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <img class="icon me-2" src="./dist/external/octicons/info.svg"
                                        data-bs-toggle="tooltip" data-bs-placement="top"
                                        title="Quickly offset the current trace default shot" /> <!-- TODO: Improve -->
                                    <button class="btn btn-primary" type="button" data-action="prev-shot">
                                        -1
                                    </button>
                                </li>
                                <li>
                                    <div class="current-shot" data-display="current-shot"
                                        data-bs-toggle="tooltip" data-bs-placement="top"
                                        title="No Current">No Current</div>
                                </li>
                                <li class="nav-item">
                                    <button class="btn btn-primary" type="button" data-action="next-shot">
                                        +1
                                    </button>
                                    <button class="btn btn-primary" type="button" data-action="reset-shot" disabled="disabled">
                                        Reset
                                    </button>
                                </li>
                            </ul>
                            <div class="navbar-brand window-title">Window Title</div>
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <button class="btn btn-primary" type="button" data-action="add-panel">
                                        Add Panel
                                    </button>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" data-action="refresh" role="button">
                                        <img class="icon" src="./dist/external/octicons/sync.svg" />
                                    </a>
                                </li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle active" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <img class="icon" src="./dist/external/octicons/three-bars.svg" />
                                    </a>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li><a class="dropdown-item nav-link" role="button" data-action="import">Import</a></li>
                                        <li><a class="dropdown-item nav-link" role="button" data-action="export">Export</a></li>
                                        <li><a class="dropdown-item nav-link" role="button" data-action="settings">Settings</a></li>
                                        <li><hr /></li>
                                        <li><a class="dropdown-item nav-link text-danger" role="button" data-action="reset">Reset</a></li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    </nav>
                    <div id="panels" class="grid-stack"></div>
                </div>
            </div>
            <div class="drop-overlay">
                <br />
                <br />
                <br />
                Drop a .dat, .jscp, or .json file here to import
                <br />
                <img src="./dist/external/octicons/upload.svg" width="200" height="200" style="filter: invert(1);" />
            </div>
        </div>

        <footer class="fixed-bottom d-flex flex-wrap justify-content-between align-items-center px-2 py-1 my-0 border-top bg-body-tertiary"> 
            <div id="username" class="col-md-4">Connected as unknown</div>
            <div id="error-message" class="col-md-4 d-flex align-items-center text-danger justify-content-start mb-3 mb-md-0 me-md-auto"></div>
            <div id="status" class="col-md-4 text-body-secondary justify-content-center text-center"></div>
        </footer>
        
        <div class="toast-wrapper">
            <div class="toast-stack"></div>
        </div>
    </main>

</body>
</html>
